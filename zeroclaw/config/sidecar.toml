# analyze-screen-sidecar configuration.
# Every value here can also be overridden by env vars — see README config table.
# No secrets belong in this file; use VLM_API_KEY / LLM_* env vars instead.

[server]
host = "127.0.0.1"          # keep loopback-only on the TV
port = 8787                 # {{ZEROCLAW_PORT}} for the web app's fetch()
total_timeout_secs = 90     # whole-request budget

[screenshot]
# "exec": sidecar spawns the binary itself (default).
# "watch": sidecar never spawns anything and instead waits for output_path to
#          be rewritten by an externally triggered capture — use this if the
#          TV blocks subprocess spawning from the sidecar's context.
mode = "exec"
binary_path = "/opt/usr/home/owner/tizenscreenshot"   # {{PATH_TO_BINARY}}
args = []
output_path = "/tmp/screenshot.png"                   # {{SCREENSHOT_OUTPUT_PATH}}
timeout_secs = 10

[vlm]
base_url = "http://REPLACE_ME:8000/v1"                # {{VLM_BASE_URL}}
model = "Qwen/Qwen3-VL-8B-Instruct"                   # {{VLM_MODEL_NAME}}
timeout_secs = 60
max_tokens = 1024
# api_key via VLM_API_KEY env var if your vLLM has --api-key set

# Optional separate endpoint for the JSON repair pass; omit to reuse [vlm].
# [llm]
# base_url = "http://REPLACE_ME:8000/v1"               # {{LLM_BASE_URL}}
# model = "Qwen/Qwen3-VL-8B-Instruct"
# timeout_secs = 60
# max_tokens = 1024

[downscale]
# Downscaling is optional because the TV environment is constrained.
enabled = false
max_long_edge = 1280
# Leave command empty to use the built-in resizer (needs the `downscale`
# cargo feature, on by default). Or use ImageMagick if present on the TV:
# command = "convert {in} -resize {max}x{max}> {out}"
command = ""
