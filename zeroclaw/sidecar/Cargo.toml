[package]
name = "analyze-screen-sidecar"
version = "0.1.0"
edition = "2021"
description = "Thin HTTP sidecar for ZeroClaw: screenshot -> VLM -> JSON validation for Tizen TV"

# Standalone crate: keep it out of the ZeroClaw workspace so it can be
# cross-compiled for the TV independently.
[workspace]

[dependencies]
tiny_http = "0.12"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
toml = "0.8"
wait-timeout = "0.2"
humantime = "2"

# Built-in PNG downscaling is optional: the `image` crate compiles fine for
# ARM but adds size; on very constrained TVs use an external command (e.g.
# ImageMagick) via [downscale].command instead, or disable downscaling.
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
default = ["downscale"]
downscale = ["dep:image"]

[profile.release]
opt-level = "z"
lto = true
strip = true
